function reach(u){const best={},q=[{x:u.x,y:u.y,c:0}];best[u.x+','+u.y]=0;

  for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){const x=p.x+dx,y=p.y+dy;
   if(x<0||y<0||x>=W||y>=H||blocked(x,y))continue;const o=at(x,y);if(o&&o.team!=u.team)continue;
   const c=p.c+cost(x,y);if(c>u.mov)continue;const k=x+','+y;if(best[k]===undefined||c<best[k]){best[k]=c;q.push({x,y,c})}}}

function ai(u){
 const foes=alive(u.team?0:1);if(!foes.length)return null;
 const pms=foes.map(f=>pathMap(f.x,f.y));
 let ti=0,bd=1e18;foes.forEach((f,i)=>{const d=pms[i][u.y][u.x]+(canHit(u,u,f)?-1e6:0);if(d<bd){bd=d;ti=i}});
 const t=foes[ti],pm=pms[ti];
 if(!canHit(u,u,t)&&!u.moved){
  let best=null,bs=1e18;
  for(const m of reach(u).concat([{x:u.x,y:u.y}])){
   const s=canHit(u,m,t)?-100-0.1*dist(m,t):pm[m.y][m.x]-(ter(m.x,m.y)=='T'?0.05:0)-(u.team==0?(chests.some(q=>q.x==m.x&&q.y==m.y)||drops.some(q=>q.x==m.x&&q.y==m.y)?3:0):0);
   if(s<bs){bs=s;best=m}}
  if(best){if(best.x!=u.x||best.y!=u.y)u.mvf={x:u.x,y:u.y};u.x=best.x;u.y=best.y;sfx('step');pick(u)}
  u.moved=true;
 }
 if(!canHit(u,u,t)){const o=foes.find(f=>canHit(u,u,f));return o||t}
 return t;
}

  if(P.rev)return units.some(x=>x.team==0&&x.hp<=0)?{t:null}:null;
  if(P.again)return en.length>=2?{t:null}:null;
  if(a.t=='al'){const c=al.filter(x=>dist(x,u)<=3&&r(x)<.65).sort((x,y)=>r(x)-r(y))[0];return c?{t:c}:null}
  if(P.m)return en.some(e=>dist(e,u)<=(P.ar||1)+1)?{t:null}:null;
  return al.filter(x=>r(x)<.7).length>=2||al.some(x=>r(x)<.4)||(!P.hl&&en.some(e=>dist(e,u)<=4))?{t:null}:null}
 if(u.sk=='h1'){const c=al.filter(a=>dist(a,u)<=3&&r(a)<.65).sort((a,b)=>r(a)-r(b))[0];return c?{t:c}:null}
 if(u.sk=='h2'){const n=al.filter(a=>r(a)<.7).length;return n>=2||al.some(a=>r(a)<.4)?{t:null}:null}
 if(u.sk=='h3'){const n=al.filter(a=>r(a)<.75).length;return n>=2||al.some(a=>r(a)<.45)||(en.length>=3&&n>=1)?{t:null}:null}

 return null}

  if(u.team==0&&u.sk&&u.cd==0){const s=SKL[u.sk];

 if(!L.children.length)L.innerHTML='<div class="pe">'+(invTab==1?'Belum ada senjata.':'Semua senjata sudah dibuat! 🎉')+'</div>'}
$('tb1').onclick=()=>{invTab=1;renderInv()};$('tb2').onclick=()=>{invTab=2;renderInv()};$('invx').onclick=()=>{$('inv').style.display='none'};
const PARTNERS=[{id:0,n:'Tanpa Partner',d:'Bertarung sendirian.'},{id:'aelin',d:'Penjaga altar. Menyerang dari jauh dengan cahaya (jarak 2).'},{id:'tiko',d:'Petarung jarak dekat yang tangguh dengan perisai kayu.'}];
function openPartner(){$('ptn').style.display='flex';renderPartner()}
function renderPartner(){const L=$('ptl');L.innerHTML='';const f=1+.1*((SAVE.me.lvl||1)-1);
 PARTNERS.forEach(p=>{const r=document.createElement('div'),on=(SAVE.pet||0)==p.id,t=p.id?T[p.id]:null;r.className='wr'+(on?' eq':'');
  r.innerHTML=(p.id?'<img src="'+fr({k:p.id,cu:{}},0)+'">':'<img style="font-size:30px;text-align:center" alt="">')+'<div class="t"><b>'+(t?t.n:p.n)+'</b><small>'+p.d+'</small>'+(t?'<small>HP '+Math.round(t.hp*f)+' • ATK '+Math.round(t.atk*f)+' • Jarak '+t.rng+' • Gerak '+t.mov+'</small>':'')+'</div>';
  const b=document.createElement('button');b.textContent=on?'Aktif':'Pilih';b.disabled=on;b.onclick=()=>{SAVE.pet=p.id;save();sfx('click');renderPartner();lobby()};r.appendChild(b);L.appendChild(r)})}
$('ptx').onclick=()=>{$('ptn').style.display='none'};

// ---------- tombol ----------
$('end1').onclick=()=>{if(!auto)endTurn()};
$('bt').onclick=()=>{if(busy||auto||over||phase!='me'||!sel)return;sfx('click');foeSel=null;
 if(!sel.moved&&!sel.acted){sel=null;armed=null;draw();return}
 sel.acted=true;sel.moved=true;sel.undo=null;log(sel.n+' menunggu.');sel=null;armed=null;draw()};
$('ur').onclick=()=>{if(busy||auto||over||phase!='me'||!sel||!sel.undo||!sel.moved||sel.acted)return;sfx('click');
 sel.x=sel.undo.x;sel.y=sel.undo.y;sel.moved=false;sel.undo=null;foeSel=null;log('Gerakan dibatalkan.');draw()};
document.addEventListener('pointerdown',()=>{try{const d=document.documentElement;if(!document.fullscreenElement&&d.requestFullscreen)d.requestFullscreen({navigationUI:'hide'}).catch(()=>{})}catch(e){}try{screen.orientation.lock('landscape').catch(()=>{})}catch(e){}},{once:true});
$('auto').onclick=()=>{auto=!auto;setAuto();if(auto&&!over)runAuto()};
$('rs').onclick=()=>{if(!over)$('cf').style.display='flex'};
$('cfn').onclick=()=>{$('cf').style.display='none'};
$('cfy').onclick=()=>{$('cf').style.display='none';if(!over){busy=false;if(tower)towerEnd(true);else finish(false)}};
$('again').onclick=()=>{busy=false;$('end').style.display='none';lobby()};
$('stup').onclick=climb;$('stout').onclick=()=>towerEnd(true);
$('mute').onclick=()=>{mute=!mute;$('mute').textContent=mute?'🔇':'🔊'};
$('go').onclick=()=>{tower=false;story=false;busy=false;init()};
$('sv').onclick=()=>{busy=false;towerStart()};
VOL=SAVE.vol??1.6;$('vol').value=VOL;$('vol').oninput=e=>{VOL=+e.target.value;SAVE.vol=VOL;if(MG)MG.gain.value=VOL;save();sfx('click')};
$('slb').onclick=showSlots;$('rnc').onclick=()=>{$('rnm').style.display='none'};$('rns').onclick=()=>{const v=$('rni').value.replace(/[<>&\"'`\\]/g,'').trim().slice(0,12);if(v)rh.name=v;save();$('rnm').style.display='none';sfx('click');lobby()};$('cud').onclick=()=>{$('cu').style.display='none';save();lobby()};
$('skb').style.display='none';$('wpb').onclick=openInv;$('ptb').onclick=openPartner;$('rn2').onclick=()=>rename(SAVE.me);$('slx').onclick=()=>{$('sl').style.display='none'};
lobby();showSlots();
</script>
