name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Siapkan project Capacitor
        run: |
          mkdir -p www
          [ -f index.html ] && cp index.html www/index.html || true
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          cat > capacitor.config.json << 'CFG'
          {
            "appId": "com.kartu.kwartet",
            "appName": "Kontrol Battle",
            "webDir": "www"
          }
          CFG
          npx cap add android
          npx cap sync android

      - name: Layar penuh (sembunyikan status bar)
        run: |
          sed -i 's|<style name="AppTheme.NoActionBar" parent="\(.*\)">|&\n        <item name="android:windowFullscreen">true</item>|' android/app/src/main/res/values/styles.xml
          grep -n windowFullscreen android/app/src/main/res/values/styles.xml || true

      - name: Kunci layar landscape
        run: |
          sed -i 's/<activity/<activity android:screenOrientation="sensorLandscape"/' android/app/src/main/AndroidManifest.xml
          grep -n screenOrientation android/app/src/main/AndroidManifest.xml

      - name: Build APK debug
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: Kontrol-Battle-apk
          path: android/app/build/outputs/apk/debug/*.apk
